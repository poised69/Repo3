<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>POD Town</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b2a1b'/%3E%3Crect x='3' y='7' width='10' height='6' fill='%238d908a'/%3E%3Crect x='2' y='5' width='12' height='2' fill='%23333a3c'/%3E%3Crect x='5' y='9' width='2' height='2' fill='%23ffd070'/%3E%3Crect x='9' y='9' width='2' height='2' fill='%23ffd070'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="town" width="480" height="288" aria-label="Animated pixel-art town representing the POD automation pipeline"></canvas>
    </main>

    <aside class="panel">
      <header class="panel__head">
        <h1>POD Town</h1>
        <p class="panel__status" id="townStatus">Connecting&hellip;</p>
      </header>

      <section class="feeds" aria-label="Detection sources">
        <div class="feed" id="feedMake">
          <span class="feed__dot" aria-hidden="true"></span>
          <div>
            <strong>Make</strong>
            <span class="feed__detail">&mdash;</span>
          </div>
        </div>
        <div class="feed" id="feedTelegram">
          <span class="feed__dot" aria-hidden="true"></span>
          <div>
            <strong>Telegram</strong>
            <span class="feed__detail">&mdash;</span>
          </div>
        </div>
      </section>

      <section aria-label="Buildings">
        <ul class="buildings" id="buildingList"></ul>
      </section>

      <section class="notes" id="notes" hidden>
        <h2>Notes</h2>
        <ul id="noteList"></ul>
      </section>

      <footer class="panel__foot">
        Read-only. Consumes zero Make operations.
      </footer>
    </aside>

    <script type="module" src="town.js"></script>
  </body>
</html>
